name: Build Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Compile Python
        run: python -m py_compile app/server.py

      - name: Bandit security scan
        run: python -m bandit -q -r app -ll

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean CoXRaidDashboard.spec

      - name: Build Windows installer
        shell: powershell
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            throw "Inno Setup compiler ISCC.exe was not found."
          }

          & $iscc ".\installer\CoXRaidDashboard.iss"

      - name: Generate SHA-256 checksums
        shell: powershell
        run: |
          $files = @(
            ".\dist\CoXRaidDashboard.exe",
            ".\dist-installer\CoXRaidDashboard-Setup.exe"
          )

          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }

          $lines | Set-Content -Encoding ascii ".\SHA256SUMS.txt"

      - name: Attest standalone executable
        uses: actions/attest@v4
        with:
          subject-path: dist/CoXRaidDashboard.exe

      - name: Attest installer
        uses: actions/attest@v4
        with:
          subject-path: dist-installer/CoXRaidDashboard-Setup.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoXRaidDashboard-${{ github.ref_name }}
          path: |
            dist/CoXRaidDashboard.exe
            dist-installer/CoXRaidDashboard-Setup.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${env:GITHUB_REF_NAME}" `
            ".\dist\CoXRaidDashboard.exe" `
            ".\dist-installer\CoXRaidDashboard-Setup.exe" `
            ".\SHA256SUMS.txt" `
            --verify-tag `
            --generate-notes `
            --title "${env:GITHUB_REF_NAME}"
