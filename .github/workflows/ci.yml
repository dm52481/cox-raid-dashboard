name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Compile Python
        run: python -m py_compile app/server.py

      - name: Bandit security scan
        run: python -m bandit -q -r app

      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean CoXRaidDashboard.spec

      - name: Upload CI executable
        uses: actions/upload-artifact@v7
        with:
          name: CoXRaidDashboard-ci
          path: dist/CoXRaidDashboard.exe
          if-no-files-found: error
